name: Compile Java
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: find . -name '*.java' -not -path './out/*' -not -path './bin/*' -print0 | xargs -0 javac -encoding UTF-8 -d out
